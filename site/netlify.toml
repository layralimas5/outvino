# Deploy da LOJA (site público) na Netlify.
#
# Esse arquivo é lido por um projeto Netlify que tem `site` como base
# directory. O back-office é outro projeto Netlify, com base `sistema`,
# apontando pro mesmo repositório.
#
# O build não fala com a API: o catálogo vem de `src/data/catalogo.json`, que é
# commitado. Depois de mexer em produto no painel, rode `npm run sync` na sua
# máquina e publique, senão o site continua com o catálogo antigo.

[build]
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hash no nome do arquivo: pode cachear pra sempre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
